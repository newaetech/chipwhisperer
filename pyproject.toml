[build-system]
requires = ["setuptools >= 61.0", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
#version = "0.0.1"  # Remove any existing version parameter.
dynamic = ["version"]
description="ChipWhisperer Side-Channel Analysis Tool"
name = "chipwhisperer"
authors=[{name="Colin O'Flynn", email="coflynn@newae.com"}]
requires-python = ">=3.9"
dependencies = [
        "configobj",
        "pyserial",
        "numpy>=2.0.0",
        "libusb1",
        "ECpy",
        "Cython",
        "tqdm",
        "libusb1",
]
license = {file = "LICENSE.txt"}
readme = "README.md"

[project.optional-dependencies]
trace = ["software"]
studio = [
        "fastapi>=0.110",
        "uvicorn[standard]>=0.27",
        "python-multipart>=0.0.9",
        "websockets>=12",
]

[project.scripts]
cw-studio = "cwstudio.cli:main"

[project.urls]
Homepage = "https://www.chipwhisperer.com"
Documentation = "https://chipwhisperer.readthedocs.io/en/latest/"
Repository = "https://github.com/newaetech/chipwhisperer"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
cwstudio = ["static/*", "static/**/*", "resources/*"]

[tool.setuptools.packages.find]
where = ["software"]

[tool.setuptools.dynamic]
version = {attr = "chipwhisperer.__version__"}
